# Server Configuration
server.port=8085

# Multipart Upload Configuration
# In-memory buffering for uploads <= 2MB. Files up to 20MB may use servlet temporary files
# in the system temp directory, which are automatically deleted upon request completion.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
spring.servlet.multipart.file-size-threshold=2MB
spring.servlet.multipart.resolve-lazily=false

# Google Gemini AI Configuration
# Credentials must be set via environment variable (GEMINI_API_KEY or AI_API_KEY)
ai.api.key=${GEMINI_API_KEY:${AI_API_KEY:}}
ai.api.url=${GEMINI_API_URL:${AI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent}}

# CORS Configuration
cors.allowed-origins=${FRONTEND_URL:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

# Logging (Strictly no sensitive contract text or user PII logged)
logging.level.root=INFO
logging.level.com.contractrisk=INFO
